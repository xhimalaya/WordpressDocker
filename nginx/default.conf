server {
    listen 80;
    server_name thedigimarketer.in www.thedigimarketer.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    server_name thedigimarketer.in www.thedigimarketer.in;

    ssl_certificate /etc/letsencrypt/live/thedigimarketer.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thedigimarketer.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "geolocation=()";

    location / {
        proxy_pass http://wordpress:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;

        proxy_buffering off;
    }

    location = /xmlrpc.php {
        proxy_pass http://wordpress:80/xmlrpc.php;
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }
}