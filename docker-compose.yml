services:
  wordpress:
    build: .
    container_name: wordpress
    restart: always

    environment:
      WORDPRESS_DB_HOST: host.docker.internal:3306
      WORDPRESS_DB_NAME: thedigimarketerdb
      WORDPRESS_DB_USER: thedigimarketeruser
      WORDPRESS_DB_PASSWORD: "!l0v33n&"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - wordpress_data:/var/www/html

  nginx:
    image: nginx:latest
    container_name: wordpress_nginx
    restart: always
    depends_on:
      - wordpress

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  wordpress_data: